# ============ 多策略资金组合（实验：不改 active_api，除非回测通过）============
# 各渠道独立仓位按因果 trailing Sharpe 加权；主袖下限防漂
strategy_portfolio:
  primary: deepseek
  members:
    - deepseek
    - qwen
    - glm
  lookback: 252
  min_history: 60
  primary_floor: 0.50
  weight_method: sharpe          # sharpe | equal
  temperature: 1.0
  commission: 0.0003
  slippage: 0.0005

# ============ 模拟实盘（自主交易参考，非真实下单）============
paper_trading:
  enabled: true
  initial_capital: 1000000       # 初始模拟资金（元）
  auto_run: false                # 由 auto_update 统一调度
  refresh_data: true             # 每轮执行前刷新行情
  schedule_time: "16:30"         # 周五执行（Asia/Shanghai，systemd timer=Fri）
  schedule_weekday: "Fri"        # 周频硬切：仅周五（当周最后交易日）跑
  start_date: "2026-07-10"       # 模拟实盘起始日

# ============ 收盘后自动更新（数据 + 增量回测 + 模拟实盘）============
auto_update:
  enabled: true
  schedule_time: "16:45"         # 周五收盘后（建议晚于 paper_trading）
  schedule_weekday: "Fri"
  refresh_data: true             # 拉取最新行情写入 DB
  incremental_backtest: true     # true=仅新 bar/week_end 调 LLM API，历史读 llm_cache
  allow_full_backtest: false     # 定时更新禁止全量；策略变更也只走增量
  rewind_bars: 130               # 增量重放窗口（约 26 周 ×5 日）
  run_paper_trading: true        # 回测后同步跑模拟实盘

logging:
  level: "INFO"
  structured: true
  feature_snapshot: true
  mirror_to_loguru: false
  save_predictions: true
  save_models: true
