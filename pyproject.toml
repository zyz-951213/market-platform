[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-platform"
version = "1.0.0"
description = "统一 A 股量化平台：数据底座 + 行为分析 + 指数预测"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Market Platform Contributors" }]
keywords = ["quantitative-finance", "a-shares", "llm", "transformer", "nmf", "hmm", "backtest"]
dependencies = [
    "akshare>=1.14.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "scipy>=1.12.0",
    "baostock>=0.8.8",
    "requests>=2.31.0",
    "torch>=2.0.0",
    "loguru>=0.7.0",
    "structlog>=24.1.0",
    "yfinance>=0.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]
postgres = ["psycopg[binary]>=3.1.0"]
network = ["curl_cffi>=0.6.0"]
optional = ["sentence-transformers>=2.2.0", "jupyter>=1.0.0", "ipykernel>=6.0.0", "seaborn>=0.12.0"]

[project.scripts]
market-agents = "market_platform.agents.cli:main"
market-predictor = "market_platform.predictor.命令行:main"
market-platform = "market_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_platform*"]

[tool.setuptools.package-data]
"market_platform.agents" = ["存储/schema.sql"]
"market_platform.predictor" = ["存储/schema.sql"]
